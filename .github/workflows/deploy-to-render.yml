name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Triggering Render deploy for commit $COMMIT"
          RESPONSE=$(curl -s -X POST "https://api.render.com/deploy/${RENDER_SERVICE_ID}" -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Content-Type: application/json" -d "{\"commit\":\"${COMMIT}\"}")
          echo "Deploy trigger response: $RESPONSE"
          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.deploy.id // .id // .deploy_id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "No deploy id in response. Searching deploys list for the commit..."
            DEPLOY_ID=$(curl -s "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r --arg commit "$COMMIT" '.[] | select(.deploy.commit.id==$commit) | .deploy.id' | head -n1)
          fi
          if [ -z "$DEPLOY_ID" ]; then
            echo "Could not find deploy id for commit $COMMIT"
            exit 1
          fi
          echo "Found deploy id: $DEPLOY_ID"
          # Poll for status until success or failure
          for i in $(seq 1 30); do
            STATUS=$(curl -s "https://api.render.com/v1/deploys/${DEPLOY_ID}" -H "Authorization: Bearer ${RENDER_API_KEY}" | jq -r '.status // empty')
            echo "[poll $i] status: $STATUS"
            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "deactivated" ]; then
              echo "Deploy finished with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for the deploy to complete"
          exit 1
