<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#4338ca" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Three pillars -->
  <!-- Left pillar -->
  <rect x="100" y="140" width="70" height="232" rx="8" fill="white" opacity="0.95"/>
  <rect x="92" y="120" width="86" height="30" rx="6" fill="white" opacity="0.95"/>
  <rect x="92" y="362" width="86" height="30" rx="6" fill="white" opacity="0.95"/>
  
  <!-- Center pillar (taller) -->
  <rect x="221" y="100" width="70" height="272" rx="8" fill="white"/>
  <rect x="213" y="80" width="86" height="30" rx="6" fill="white"/>
  <rect x="213" y="362" width="86" height="30" rx="6" fill="white"/>
  
  <!-- Right pillar -->
  <rect x="342" y="140" width="70" height="232" rx="8" fill="white" opacity="0.95"/>
  <rect x="334" y="120" width="86" height="30" rx="6" fill="white" opacity="0.95"/>
  <rect x="334" y="362" width="86" height="30" rx="6" fill="white" opacity="0.95"/>
  
  <!-- Base -->
  <rect x="70" y="392" width="372" height="24" rx="8" fill="white" opacity="0.9"/>
</svg>
