<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="16" height="16" rx="3" fill="#7C3AED"/>
  
  <!-- Three pillars - pixel perfect at 16x16 -->
  <rect x="2" y="5" width="3" height="7" fill="#FFF"/>
  <rect x="6" y="3" width="4" height="9" fill="#FFF"/>
  <rect x="11" y="5" width="3" height="7" fill="#FFF"/>
  
  <!-- Base -->
  <rect x="2" y="12" width="12" height="2" fill="#FFF"/>
</svg>
