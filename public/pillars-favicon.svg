<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pillars">
  <!-- Flat, high-contrast favicon optimized for small sizes -->
  <rect width="64" height="64" rx="12" fill="#6D28D9" />

  <!-- Pillars simplified: three white rectangles with crisp edges -->
  <rect x="10" y="18" width="10" height="28" fill="#FFFFFF" />
  <rect x="27" y="12" width="10" height="34" fill="#FFFFFF" />
  <rect x="44" y="18" width="10" height="28" fill="#FFFFFF" />

  <!-- Bases (thin caps) to keep silhouette readable at 16px -->
  <rect x="6" y="44" width="52" height="4" rx="1" fill="#FFFFFF" />
</svg>
